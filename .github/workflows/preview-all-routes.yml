name: Audit all OpenKuasa preview navigation routes

on:
  push:
    branches:
      - deploy/openkuasa-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      OPENKUASA_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate route types and check TypeScript
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit
      - name: Build entire Next.js app for OpenNext
        run: pnpm run build:opennext
      - name: Start actual Worker preview and audit all menu routes
        shell: bash
        run: |
          set -euo pipefail
          printf 'OPENKUASA_PREVIEW=1\n' > .dev.vars
          pnpm run preview:opennext -- --port 8787 > /tmp/openkuasa-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; tail -n 90 /tmp/openkuasa-worker.log' EXIT
          for attempt in $(seq 1 50); do
            if curl -sf http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 2
          done
          SMOKE_BASE_URL=http://127.0.0.1:8787 node scripts/smoke-workers-routes.mjs
      - name: Upload runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: route-audit-runtime-errors
          path: /tmp/openkuasa-worker.log
          if-no-files-found: ignore
