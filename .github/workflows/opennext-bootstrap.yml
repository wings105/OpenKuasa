name: Bootstrap OpenNext fallback (test branch)

on:
  push:
    branches:
      - fix/cloudflare-opennext-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      OPENKUASA_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-opennext-test
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install pinned adapter and Wrangler
        shell: bash
        run: |
          set -euo pipefail
          if ! node -e "if(!require('./package.json').devDependencies?.['@opennextjs/cloudflare']) process.exit(1)"; then
            pnpm add --save-dev --save-exact @opennextjs/cloudflare@1.20.12 wrangler@4.151.3
          else
            pnpm install --frozen-lockfile
          fi
          pnpm exec opennextjs-cloudflare --help
      - name: Commit dependency changes to test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build: pin OpenNext and Wrangler for Cloudflare test"
            git push origin HEAD:fix/cloudflare-opennext-test
          fi
      - name: Compile full Next.js application and adapt output
        run: pnpm run build:opennext
      - name: Verify Worker output
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          echo "OpenNext Worker bundle exists."
      - name: Upload summarized build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opennext-build-debug
          path: |
            .open-next/open-next.output.json
            .open-next/build-errors.json
          if-no-files-found: ignore
