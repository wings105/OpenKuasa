name: Bootstrap Cloudflare vinext (review branch only)

on:
  push:
    branches:
      - fix/cloudflare-workers-deploy

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'wings105/OpenKuasa'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-workers-deploy
          fetch-depth: 0
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Check if migration already generated
        id: existing
        shell: bash
        run: |
          if test -e cloudflare.config.ts || test -e vite.config.ts; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Vite/Cloudflare config exists; refusing to overwrite it."
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install existing dependencies
        if: steps.existing.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile
      - name: Allow only required native build scripts
        if: steps.existing.outputs.skip == 'false'
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const p = 'pnpm-workspace.yaml';
          let s = fs.readFileSync(p, 'utf8');
          for (const pkg of ['esbuild', 'workerd']) {
            if (new RegExp('^  ' + pkg + ':', 'm').test(s)) {
              s = s.replace(new RegExp('^  ' + pkg + ':.*$', 'm'), '  ' + pkg + ': true');
            } else {
              s = s.replace(/^allowBuilds:\s*\n/m, (line) => line + '  ' + pkg + ': true\n');
            }
          }
          fs.writeFileSync(p, s);
          NODE
      - name: Initialize vinext Cloudflare adapter
        if: steps.existing.outputs.skip == 'false'
        run: |
          pnpm dlx vinext init --platform=cloudflare --skip-check --name=openkuasa --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Pin generated dependencies and refresh lockfile
        if: steps.existing.outputs.skip == 'false'
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const orig = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:package.json'], {encoding:'utf8'}));
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const section of ['dependencies', 'devDependencies']) {
            for (const [name, value] of Object.entries(pkg[section] || {})) {
              if (!(name in (orig[section] || {})) && typeof value === 'string' && /^[~^]/.test(value)) {
                pkg[section][name] = value.slice(1);
              }
            }
          }
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Commit migration output to the fix branch
        if: steps.existing.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "build: initialize vinext Cloudflare Workers adapter"
            git push origin HEAD:fix/cloudflare-workers-deploy
          fi
      - name: Build vinext for validation (no deployment)
        if: steps.existing.outputs.skip == 'false'
        run: pnpm run build:vinext
