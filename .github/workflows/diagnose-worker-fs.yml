name: Inspect Cloudflare runtime readFile fault

on:
  push:
    branches:
      - fix/openkuasa-fs-runtime

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      OPENKUASA_PREVIEW: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build OpenNext worker
        run: pnpm run build:opennext
      - name: Inspect final Wrangler-deploy bundle at runtime stack trace
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --dry-run --outdir ./dryrun-bundle
          node <<'NODE'
          const fs = require('fs'), path = require('path');
          function list(dir) { return fs.readdirSync(dir,{withFileTypes:true}).flatMap(e => e.isDirectory()?list(path.join(dir,e.name)):[path.join(dir,e.name)]); }
          const js = list('dryrun-bundle').filter(p=>/\\.(?:js|mjs)$/.test(p));
          console.log('Compiled worker files:',js.map(p=>({p,size:fs.statSync(p).size})));
          for(const p of js.slice(0,5)) {
            const lines=fs.readFileSync(p,'utf8').split('\\n');
            console.log('PATH:',p,'LINES:',lines.length);
            if (lines.length<80000) continue;
            for(const lineNo of [81935,81933]){
              console.log('--- At '+lineNo+' ---');
              for(let n=lineNo-15;n<=lineNo+15;n++) console.log(n+': '+(lines[n-1]||'').slice(0,650));
            }
          }
          NODE
      - name: Check Worker root via local workerd preview
        shell: bash
        run: |
          printf 'OPENKUASA_PREVIEW=1\n' > .dev.vars
          pnpm run preview:opennext -- --port 8787 > /tmp/openkuasa-preview.log 2>&1 &
          trap 'tail -n 60 /tmp/openkuasa-preview.log' EXIT
          for i in $(seq 1 35); do
            code=$(curl -s -o /tmp/ok.html -w '%{http_code}' http://127.0.0.1:8787/ || true)
            if [ "$code" = 200 ]; then echo "Root local HTTP 200"; exit 0; fi
            sleep 2
          done
          exit 1
