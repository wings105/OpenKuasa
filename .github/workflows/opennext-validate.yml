name: OpenNext fallback validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      OPENKUASA_PREVIEW: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build entire Next.js app and OpenNext output
        run: pnpm run build:opennext
      - name: Verify Worker bundle
        run: |
          test -s .open-next/worker.js
          test -d .open-next/assets
          echo "OpenNext bundle generated"
